apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-sale-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flash-sale
  template:
    metadata:
      labels:
        app: flash-sale
    spec:
      containers:
      - name: flash-sale-app
        image: flash-sale-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 15000
---
apiVersion: v1
kind: Service
metadata:
  name: flash-sale-service
spec:
  selector:
    app: flash-sale
  ports:
  - port: 15000
    targetPort: 15000
  type: NodePort

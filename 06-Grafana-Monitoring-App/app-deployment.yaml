apiVersion: apps/v1
kind: Deployment
metadata:
  name: zepto-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zepto-app
  template:
    metadata:
      labels:
        app: zepto-app
    spec:
      containers:
      - name: zepto-app
        image: zepto-metrics-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: zepto-app-service
spec:
  selector:
    app: zepto-app
  ports:
  - port: 8000
    targetPort: 8000
  type: NodePort
